[project]
name = "rtbhouse-sdk"
version = "16.1.0"
description = "RTB House SDK"
authors = [{ name = "RTB House Apps Team", email = "apps@rtbhouse.com" }]
requires-python = ">=3.10, <4.0"
readme = "README.rst"
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.3.1,<9",
    "filelock>=4.0.0,<5",
    "httpx>=0.28.0,<0.29",
    "pydantic>=1.9, <3.0",
]

[project.urls]
Homepage = "https://github.com/rtbhouse-apps/rtbhouse-python-sdk"
Repository = "https://github.com/rtbhouse-apps/rtbhouse-python-sdk"

[dependency-groups]
dev = [
    "freezegun>=1.5.5,<2",
    "pydantic>=2.0.0,<3",
    "black>=26.0.0,<27",
    "flake8>=7.0.0,<8",
    "isort>=9.0.0,<10",
    "mypy>=2.0,<3",
    "pylint>=4.0.0,<5",
    "pytest>=9.0.0,<10",
    "pytest-asyncio>=1.0.0,<2",
    "pytest-cov>=7.0.0,<8",
    "respx>=0.23.0,<0.24",
]

[tool.uv]
required-version = ">=0.13.5,<0.14"

[tool.hatch.build.targets.sdist]
include = ["rtbhouse_sdk"]

[tool.hatch.build.targets.wheel]
packages = ["rtbhouse_sdk"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312", "py313"]

[tool.coverage.run]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true

[tool.isort]
line_length = 120
profile = "black"

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = false
warn_untyped_fields = true

[tool.pylint.main]
py-version = "3.10"
load-plugins = """
    pylint.extensions.check_elif,
    pylint.extensions.confusing_elif,
    pylint.extensions.consider_ternary_expression,
    pylint.extensions.empty_comment,
    pylint.extensions.eq_without_hash,
    pylint.extensions.for_any_all,
    pylint.extensions.redefined_loop_name,
    pylint.extensions.redefined_variable_type,
    pylint.extensions.set_membership,
    pylint.extensions.typing,
"""

[tool.pylint.format]
max-line-length = "120"

[tool.pylint.message_control]
enable = "all"
disable = """
    duplicate-code,
    invalid-name,
    locally-disabled,
    missing-class-docstring,
    missing-function-docstring,
    suppressed-message,
    too-many-positional-arguments,
    use-implicit-booleaness-not-comparison-to-zero,
    use-implicit-booleaness-not-comparison,
"""
extension-pkg-whitelist = "pydantic"

[tool.pytest.ini_options]
addopts = "--cov=rtbhouse_sdk/ --cov-report=term"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
